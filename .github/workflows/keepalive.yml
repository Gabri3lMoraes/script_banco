name: Supabase keep-alive

on:
  schedule:
    - cron: "17 12 */2 * *"   # a cada 2 dias, 09:17 de Brasília
    - cron: "0 13 1 * *"      # dia 1 de cada mês: também faz um commit
  workflow_dispatch:          # botão "Run workflow" para testar

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pingar projetos
        env:
          SUPABASE_PROJECTS: ${{ secrets.SUPABASE_PROJECTS }}
        run: node ping.js

      # O GitHub desliga agendamentos de repositórios sem commit há 60 dias.
      # Um commit mensal mantém o workflow vivo.
      - name: Commit mensal
        if: github.event.schedule == '0 13 1 * *'
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > ultima-execucao.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ultima-execucao.txt
          git commit -m "keep-alive: execução mensal" || echo "nada para commitar"
          git push
